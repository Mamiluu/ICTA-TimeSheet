<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add your organisation to Daymark</title>
<meta name="description" content="Ask to add your organisation to Daymark. We confirm your email and set you up.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/daymark-180.png">
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{ font-family:"Bricolage Grotesque"; src:url(assets/fonts/bricolage.woff2) format("woff2"); font-weight:200 800; font-display:swap; }
  @font-face{ font-family:"Figtree"; src:url(assets/fonts/figtree.woff2) format("woff2"); font-weight:300 900; font-display:swap; }
  :root{
    --ui:"Figtree", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    --display:"Bricolage Grotesque", "Figtree", "Segoe UI", system-ui, sans-serif;
    --ink:#1c1e23; --soft:#5d6472; --line:#e4e1d8; --sun:#ffd36b; --ok:#1f8f63; --bad:#c9243c;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:var(--ui); font-size:16px; line-height:1.5; color:var(--ink); background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--ink); outline-offset:3px; border-radius:8px; }

  .box{ width:min(440px, 100%); }
  .brand{ display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.02em; margin:0 0 22px; }
  .brand img{ width:34px; height:34px; display:block; }

  .card{ border:1.5px solid var(--line); border-radius:20px; padding:26px 26px 22px; box-shadow:0 18px 40px -28px rgba(28,30,35,.35); }
  h1{ font-family:var(--display); font-size:26px; letter-spacing:-.03em; line-height:1.1; font-weight:760; margin:0 0 4px; }
  .sub{ color:var(--soft); margin:0 0 20px; font-size:15.5px; }

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .field{ margin-bottom:13px; }
  label{ display:block; font-weight:700; font-size:13.5px; margin-bottom:5px; }
  .opt{ font-weight:400; color:var(--soft); }
  input, textarea{ width:100%; font:inherit; font-size:16px; padding:10px 13px; border:1.5px solid #d9d6cb; border-radius:11px; background:#fff; color:var(--ink); transition:border-color .15s, box-shadow .15s; }
  textarea{ min-height:68px; resize:vertical; }
  input:hover, textarea:hover{ border-color:#b9b5a6; }
  input:focus, textarea:focus{ outline:none; border-color:var(--ink); box-shadow:3px 3px 0 var(--sun); }
  ::placeholder{ color:#a9a595; }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .addnote{ background:none; border:0; padding:0; font:inherit; font-size:14px; color:var(--soft); text-decoration:underline; cursor:pointer; margin:0 0 14px; }
  .addnote:hover{ color:var(--ink); }

  .btn{ width:100%; display:inline-flex; justify-content:center; align-items:center; gap:9px; font:inherit; font-size:16px; font-weight:700; padding:13px 22px; border-radius:13px; background:var(--ink); color:#fff; border:2px solid var(--ink); cursor:pointer; box-shadow:3px 3px 0 var(--sun); transition:transform .12s, box-shadow .12s; text-decoration:none; }
  .btn:hover:not(:disabled){ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--sun); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn svg{ width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .msg{ margin:12px 0 0; font-size:14.5px; }
  .msg:empty{ display:none; }
  .msg.err{ color:var(--bad); font-weight:700; }
  .fine{ margin:16px 0 0; font-size:14px; color:var(--soft); text-align:center; }
  .fine a{ color:var(--ink); font-weight:600; }

  .done{ text-align:center; padding:6px 0 2px; }
  .done .badge{ width:58px; height:58px; border-radius:50%; background:#d7f1e5; display:grid; place-items:center; margin:0 auto 14px; }
  .done .badge svg{ width:28px; height:28px; stroke:var(--ok); fill:none; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
  .done .badge.bad{ background:#ffdfe3; } .done .badge.bad svg{ stroke:var(--bad); }
  .done h1{ font-size:24px; }
  .done p{ color:var(--soft); margin:6px auto 18px; max-width:34ch; font-size:15.5px; }
  [hidden]{ display:none !important; }

  @media (max-width:420px){ .row2{ grid-template-columns:1fr; } .card{ padding:22px 18px 18px; } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="box" id="formView">
  <a class="brand" href="home.html"><img src="assets/daymark-mark.svg" alt="" width="34" height="34">Daymark</a>
  <div class="card">
    <div id="formBox">
      <h1>Add your organisation</h1>
      <p class="sub">We will email you to confirm, then set you up.</p>
      <form id="form" novalidate>
        <div class="field"><label for="organisationName">Organisation</label><input type="text" id="organisationName" maxlength="100" autocomplete="organization" placeholder="e.g. County Health Department" required></div>
        <div class="row2">
          <div class="field"><label for="contactName">Your name</label><input type="text" id="contactName" maxlength="80" autocomplete="name" required></div>
          <div class="field"><label for="phone">Phone <span class="opt">(optional)</span></label><input type="tel" id="phone" maxlength="30" autocomplete="tel"></div>
        </div>
        <div class="field"><label for="contactEmail">Work email</label><input type="email" id="contactEmail" maxlength="120" autocomplete="email" placeholder="name@yourorganisation.go.ke" required></div>
        <div class="field" id="noteField" hidden><label for="message">What will you use it for? <span class="opt">(optional)</span></label><textarea id="message" maxlength="500" placeholder="e.g. Staff trainings across our regional offices"></textarea></div>
        <button type="button" class="addnote" id="addNote">Add a note</button>
        <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
        <button type="submit" class="btn" id="send">Send my request <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <div class="done" id="doneBox" hidden>
      <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
      <h1>Check your email</h1>
      <p id="doneText"></p>
      <a class="btn" href="home.html">Back to the home page</a>
    </div>
  </div>
  <p class="fine" id="fine">Already registered? <a href="login.html">Log in</a></p>
</div>

<div class="box" id="verifyView" hidden>
  <a class="brand" href="home.html"><img src="assets/daymark-mark.svg" alt="" width="34" height="34">Daymark</a>
  <div class="card done">
    <div class="badge" id="vBadge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
    <h1 id="verifyTitle">Confirming your email</h1>
    <p id="verifyText">One moment.</p>
    <a class="btn" href="home.html">Back to the home page</a>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('verify');

  function say(text, cls){ var m = $('msg'); m.textContent = text || ''; m.className = 'msg' + (cls ? ' ' + cls : ''); }
  function post(path, body){
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return { ok: false, message: 'The server was temporarily unavailable. Please try again in a moment.' }; }); });
  }

  if(token){
    $('formView').hidden = true; $('verifyView').hidden = false;
    var xmark = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    post('/api/signup/verify', { token: token }).then(function(d){
      $('verifyTitle').textContent = d.ok ? 'Email confirmed' : 'This link did not work';
      $('verifyText').textContent = d.message || '';
      if(!d.ok){ $('vBadge').className = 'badge bad'; $('vBadge').innerHTML = xmark; }
    }).catch(function(){
      $('verifyTitle').textContent = 'No connection'; $('verifyText').textContent = 'Please try again when you have signal.';
      $('vBadge').className = 'badge bad'; $('vBadge').innerHTML = xmark;
    });
    return;
  }

  $('addNote').addEventListener('click', function(){ $('noteField').hidden = false; this.hidden = true; $('message').focus(); });

  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = $('send');
    var body = {
      organisationName: $('organisationName').value, contactName: $('contactName').value, contactEmail: $('contactEmail').value,
      phone: $('phone').value, message: $('message').value, website: $('website').value
    };
    if(!body.organisationName.trim() || !body.contactName.trim() || !body.contactEmail.trim()){ say('Please fill in your organisation, your name and your email.', 'err'); return; }
    btn.disabled = true; say('Sending…');
    post('/api/signup', body).then(function(d){
      btn.disabled = false;
      if(!d.ok){ say(d.message || 'Could not send your request.', 'err'); return; }
      say('');
      $('doneText').textContent = d.message || 'We have sent you a link. Click it to confirm your email address.';
      $('formBox').hidden = true; $('doneBox').hidden = false; $('fine').hidden = true;
    }).catch(function(){ btn.disabled = false; say('No connection. Please try again.', 'err'); });
  });
})();
</script>
</body>
</html>
