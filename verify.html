<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check a record | Daymark</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/daymark-180.png">
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{ font-family:"Bricolage Grotesque"; src:url(assets/fonts/bricolage.woff2) format("woff2"); font-weight:200 800; font-display:swap; }
  @font-face{ font-family:"Figtree"; src:url(assets/fonts/figtree.woff2) format("woff2"); font-weight:300 900; font-display:swap; }
  :root{
    --ui:"Figtree", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    --display:"Bricolage Grotesque", "Figtree", "Segoe UI", system-ui, sans-serif;
    --ink:#1c1e23; --soft:#5d6472; --line:#e4e1d8; --ok:#1f8f63; --ok-w:#e3f5ec; --bad:#c9243c; --bad-w:#fdeaed; --warn:#8a5a00; --warn-w:#fdf3dc;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--ui); font-size:16px; line-height:1.5; color:var(--ink); background:#fff; position:relative; min-height:100vh; -webkit-font-smoothing:antialiased; }
  body::before{ content:""; position:absolute; inset:0 0 auto 0; height:640px; z-index:-1; pointer-events:none;
    background:
      radial-gradient(520px 360px at 6% 4%, rgba(255,198,170,.55), transparent 70%),
      radial-gradient(560px 380px at 96% 2%, rgba(196,182,255,.5), transparent 70%),
      radial-gradient(480px 340px at 88% 60%, rgba(170,222,255,.4), transparent 70%);
    -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent); }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--ink); outline-offset:3px; border-radius:8px; }

  header{ width:min(1000px, 100% - 40px); margin:0 auto; display:flex; align-items:center; height:84px; }
  .brand{ display:flex; align-items:center; gap:11px; text-decoration:none; font-family:var(--display); font-weight:700; font-size:23px; letter-spacing:-.02em; }
  .brand img{ width:36px; height:36px; display:block; }
  header .home{ margin-left:auto; color:var(--soft); text-decoration:none; font-size:15px; }
  header .home:hover{ color:var(--ink); text-decoration:underline; }

  main{ width:min(620px, 100% - 32px); margin:0 auto; padding:34px 0 80px; }
  h1{ font-family:var(--display); font-size:clamp(32px, 5vw, 44px); line-height:1.05; letter-spacing:-.035em; font-weight:760; margin:0 0 12px; text-align:center; }
  .lede{ color:var(--soft); text-align:center; margin:0 auto 28px; max-width:42ch; font-size:17.5px; }

  form{ display:flex; gap:8px; background:#fff; border:1.5px solid var(--ink); border-radius:16px; padding:7px; margin-bottom:22px; }
  form:focus-within{ box-shadow:0 0 0 4px rgba(28,30,35,.1); }
  input[type=text]{ flex:1 1 auto; min-width:0; font:inherit; font-family:ui-monospace, Consolas, monospace; font-size:19px; letter-spacing:.1em; text-transform:uppercase; padding:11px 14px; border:0; background:transparent; color:var(--ink); }
  input[type=text]:focus{ outline:none; }
  input::placeholder{ color:#a9a595; letter-spacing:.06em; }
  button{ font:inherit; font-size:16px; font-weight:700; padding:11px 24px; border:0; border-radius:11px; background:var(--ink); color:#fff; cursor:pointer; transition:background .15s; }
  button:hover{ background:#000; }
  button:disabled{ opacity:.55; cursor:default; }

  .card{ background:#fff; border:1.5px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 18px 40px -30px rgba(28,30,35,.4); }
  .msg{ color:var(--soft); margin:0; text-align:center; padding:6px 0; }
  .verdict{ display:flex; gap:14px; align-items:center; padding:16px 18px; border-radius:16px; margin-bottom:18px; }
  .verdict .big{ width:46px; height:46px; border-radius:50%; display:grid; place-items:center; flex:none; background:#fff; }
  .verdict svg{ width:24px; height:24px; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .verdict h2{ font-family:var(--display); font-size:22px; letter-spacing:-.02em; margin:0; line-height:1.15; }
  .verdict p{ margin:2px 0 0; font-size:15px; }
  .verdict.ok{ background:var(--ok-w); } .verdict.ok svg{ stroke:var(--ok); } .verdict.ok h2{ color:#14683a; }
  .verdict.bad{ background:var(--bad-w); } .verdict.bad svg{ stroke:var(--bad); } .verdict.bad h2{ color:#9d1230; }
  .verdict.warn{ background:var(--warn-w); } .verdict.warn svg{ stroke:var(--warn); } .verdict.warn h2{ color:var(--warn); }

  dl{ display:grid; grid-template-columns:auto 1fr; gap:9px 20px; margin:0 0 18px; font-size:15.5px; }
  dt{ color:var(--soft); }
  dd{ margin:0; font-weight:600; }
  .checks{ border-top:1.5px solid var(--line); padding-top:6px; }
  .check{ display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-top:1px solid #efece3; }
  .check:first-child{ border-top:0; }
  .mark{ flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; margin-top:1px; }
  .mark.ok{ background:var(--ok-w); color:var(--ok); } .mark.bad{ background:var(--bad-w); color:var(--bad); } .mark.info{ background:#eef0f4; color:var(--soft); }
  .check .t{ font-weight:600; }
  .note{ color:var(--soft); font-size:14px; margin-top:2px; }
  .foot{ text-align:center; color:var(--soft); font-size:13.5px; margin-top:26px; }
  .foot a{ color:var(--soft); }
  @media (max-width:480px){ form{ flex-direction:column; } button{ width:100%; } input[type=text]{ text-align:center; } dl{ grid-template-columns:1fr; gap:2px; } dd{ margin-bottom:8px; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="assets/daymark-mark.svg" alt="" width="36" height="36">Daymark</a>
  <a class="home" href="/">Home</a>
</header>

<main>
  <h1>Check a record</h1>
  <p class="lede">Every sealed sheet carries a code. Type it here to see whether the sheet still matches the original.</p>

  <form id="codeForm">
    <input type="text" id="codeInput" maxlength="10" placeholder="7K2M9QXA4D" autocomplete="off" spellcheck="false" aria-label="Seal code">
    <button type="submit" id="go">Check</button>
  </form>

  <div class="card" id="result" aria-live="polite">
    <p class="msg" id="message">Enter a code to begin. You will find it at the foot of the printed sheet.</p>
  </div>
  <p class="foot">No account needed. The check only reads the record, and shows no names or signatures.</p>
</main>

<script>
  (function(){
    var form = document.getElementById('codeForm');
    var input = document.getElementById('codeInput');
    var result = document.getElementById('result');
    var go = document.getElementById('go');

    function clear(){ while(result.firstChild) result.removeChild(result.firstChild); }
    function el(tag, cls, text){ var n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; }

    var TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
    var CROSS = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    var ALERT = '<svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></svg>';

    function verdict(kind, title, text){
      var v = el('div', 'verdict ' + kind);
      var big = el('div', 'big'); big.innerHTML = kind === 'ok' ? TICK : kind === 'bad' ? CROSS : ALERT;
      var body = el('div'); body.appendChild(el('h2', null, title)); body.appendChild(el('p', null, text));
      v.appendChild(big); v.appendChild(body); return v;
    }

    function line(ok, text, note){
      var row = el('div', 'check');
      var mark = el('span', 'mark ' + (ok === null ? 'info' : ok ? 'ok' : 'bad'), ok === null ? 'i' : ok ? '✓' : '✕');
      mark.setAttribute('aria-hidden', 'true');
      var body = el('div'); body.appendChild(el('div', 't', text));
      if(note) body.appendChild(el('div', 'note', note));
      row.appendChild(mark); row.appendChild(body);
      return row;
    }

    function message(text){
      clear(); result.appendChild(el('p', 'msg', text));
    }

    function show(data){
      clear();
      var good = data.recordMatchesSeal && data.auditTrailIntact;
      if(good) result.appendChild(verdict('ok', 'This sheet is genuine', 'It matches the record it was sealed from.'));
      else if(!data.recordMatchesSeal) result.appendChild(verdict('bad', 'This sheet does not match', 'The stored record no longer matches its seal. Contact the event organiser.'));
      else result.appendChild(verdict('warn', 'This sheet could not be fully confirmed', 'Treat it with caution until the organiser confirms it.'));

      var dl = document.createElement('dl');
      [
        ['Event', data.eventName],
        ['Covers', data.scope === 'EVENT' ? (data.dayCount > 1 ? 'All ' + data.dayCount + ' days' : 'The whole sheet') : 'Day ' + data.dayPosition],
        ['Sealed', new Date(data.sealedAt).toLocaleString()],
        ['People listed', String(data.rowCount)]
      ].concat(data.scope === 'EVENT' && data.dayCount > 1
        ? data.days.map(function(d){ return ['Day ' + d.position, d.signedCount + ' of ' + d.rowCount + ' signed']; })
        : [['Signed', String(data.signedCount)]]
      ).forEach(function(pair){
        dl.appendChild(el('dt', null, pair[0])); dl.appendChild(el('dd', null, pair[1]));
      });
      result.appendChild(dl);

      var checks = el('div', 'checks');
      checks.appendChild(line(data.recordMatchesSeal,
        data.recordMatchesSeal ? 'The stored record matches its seal' : 'The stored record does not match its seal',
        data.recordMatchesSeal ? null : 'This record may have been altered. Contact the event organiser.'));
      checks.appendChild(line(data.auditTrailIntact,
        data.auditTrailIntact ? 'The activity log for this seal is intact' : 'The activity log for this seal could not be confirmed',
        data.auditTrailIntact ? null : 'Treat this sheet with caution until the organiser confirms it.'));
      checks.appendChild(line(null,
        data.changedSinceSealed ? 'The event record has changed since this sheet was sealed' : 'The event record is unchanged since this sheet was sealed',
        data.changedSinceSealed ? 'Later sign ins, edits or status changes are normal. This note only says the record moved on after sealing.' : null));
      result.appendChild(checks);
    }

    function check(code){
      code = String(code || '').replace(/[\s-]/g, '').toUpperCase();
      if(!code){ message('Enter a code to begin. You will find it at the foot of the printed sheet.'); return; }
      message('Checking…'); go.disabled = true;
      fetch('/api/seals/' + encodeURIComponent(code))
        .then(function(res){ return res.json(); })
        .then(function(data){
          go.disabled = false;
          if(data && data.ok){ show(data); return; }
          clear();
          result.appendChild(verdict('bad', 'No sheet matches that code', 'Check the code printed at the foot of the sheet and try again.'));
        })
        .catch(function(){ go.disabled = false; message('Could not reach the server. Try again in a moment.'); });
    }

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var code = input.value.replace(/[\s-]/g, '').toUpperCase();
      var url = new URL(window.location.href);
      url.searchParams.set('code', code);
      history.replaceState(null, '', url.toString());
      check(code);
    });

    var fromUrl = new URLSearchParams(window.location.search).get('code');
    if(fromUrl){
      input.value = fromUrl.replace(/[\s-]/g, '').toUpperCase();
      check(fromUrl);
    }
  })();
</script>
</body>
</html>
